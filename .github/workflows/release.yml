name: release

# Publishes via OIDC Trusted Publishing with provenance (design §5.2).
#
# Prerequisites (human setup, once — npm requires the package to already
# exist before Trusted Publisher can be configured, so this is unavoidably a
# two-step bootstrap):
#   1. One manual `npm publish` of the first version from an authenticated
#      local session (see README "Releasing" section).
#   2. On npmjs.com: package Settings -> Trusted Publisher -> GitHub Actions,
#      owner=<gh user/org>, repo=<this repo>, workflow filename=release.yml,
#      allow "npm publish". Then Settings -> Publishing access -> require
#      2FA and disallow tokens, so no token-based publish is possible again.
# package.json's "repository" field must exactly match the GitHub repo (npm
# verifies this at publish time). No long-lived npm tokens are stored here.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC for npm Trusted Publishing + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Trusted Publishing (OIDC) requires npm >= 11.5.1; the npm bundled
      # with a given Node build can lag behind that.
      - run: npm install -g npm@latest
      - run: npm --version
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check:restrictions
      - run: npm run typecheck:scripts
      - run: node scripts/check-package.mts
      - run: node scripts/bench.mts
      # dogfood gate: never release a version that fails its own check
      - run: node dist/bin/armor.js check
      # reproducible build: a second clean build must be byte-identical
      - run: |
          cp -R dist /tmp/dist-first
          rm -rf dist
          npm run build
          diff -r /tmp/dist-first dist
      - run: npm publish --provenance --access public
